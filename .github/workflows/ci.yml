name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # No submodules: the app vendors its renderer so CI needs no private checkout.
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat
      - name: Unit tests
        run: testthat::test_dir("tests/testthat", stop_on_failure = TRUE)
        shell: Rscript {0}
      - name: Prototype candidate tests (not wired into the app)
        run: Rscript docu/prototypes/test-candidate.R
      - name: App startup smoke test
        run: |
          Rscript -e 'shiny::runApp("app.R", port = 4321, launch.browser = FALSE)' > app.log 2>&1 &
          for i in $(seq 1 30); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' localhost:4321)" = "200" ] && exit 0
            sleep 2
          done
          cat app.log; exit 1
